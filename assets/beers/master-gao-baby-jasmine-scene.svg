<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="640" viewBox="0 0 960 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scene" x1="80" y1="52" x2="780" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7d65b" />
      <stop offset="1" stop-color="#f3b057" />
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="920" height="600" rx="42" fill="url(#scene)"/>
  <rect x="84" y="110" width="792" height="368" rx="28" fill="rgba(255,255,255,0.14)"/>
  <rect x="120" y="420" width="720" height="30" rx="15" fill="rgba(34,24,18,0.18)"/>
  <circle cx="224" cy="268" r="88" fill="rgba(255,255,255,0.18)"/>
  <circle cx="736" cy="220" r="58" fill="rgba(255,255,255,0.15)"/>
  <text x="120" y="170" font-size="44" fill="#fff" font-family="Arial, sans-serif" font-weight="700">高大师 婴儿茉莉花皮尔森</text>
  <text x="120" y="224" font-size="22" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif">茉莉花的香气让这支酒一上来就和传统啤酒区分开来。它不是靠重苦度取胜，而是靠轻盈、花香和很适合聊天的节奏感。</text>
  <text x="120" y="528" font-size="22" fill="#fff" font-family="Arial, sans-serif">适饮温度 4-6°C · 推荐搭配 炸鸡 · 薯条 · 烤肠</text>
  <text x="120" y="566" font-size="18" fill="rgba(255,255,255,0.86)" font-family="Arial, sans-serif">皮尔森通常比基础拉格更有啤酒花存在感，清脆微苦，适合从淡啤向风格啤酒过渡。</text>
</svg>