<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="640" viewBox="0 0 960 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scene" x1="80" y1="52" x2="780" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffad4a" />
      <stop offset="1" stop-color="#f06a2f" />
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="920" height="600" rx="42" fill="url(#scene)"/>
  <rect x="84" y="110" width="792" height="368" rx="28" fill="rgba(255,255,255,0.14)"/>
  <rect x="120" y="420" width="720" height="30" rx="15" fill="rgba(34,24,18,0.18)"/>
  <circle cx="224" cy="268" r="88" fill="rgba(255,255,255,0.18)"/>
  <circle cx="736" cy="220" r="58" fill="rgba(255,255,255,0.15)"/>
  <text x="120" y="170" font-size="44" fill="#fff" font-family="Arial, sans-serif" font-weight="700">鹅岛 IPA</text>
  <text x="120" y="224" font-size="22" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif">鹅岛 IPA 把柑橘类香气和清晰苦度控制在比较容易接受的区间，喝起来明确、有辨识度，但还不到劝退新人的程度。</text>
  <text x="120" y="528" font-size="22" fill="#fff" font-family="Arial, sans-serif">适饮温度 7-9°C · 推荐搭配 炸鸡 · 汉堡 · 重口烧烤</text>
  <text x="120" y="566" font-size="18" fill="rgba(255,255,255,0.86)" font-family="Arial, sans-serif">IPA 的重点是啤酒花带来的苦度和果香，适合已经不满足于单纯清爽口感的进阶饮者。</text>
</svg>