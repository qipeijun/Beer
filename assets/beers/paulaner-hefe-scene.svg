<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="640" viewBox="0 0 960 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scene" x1="80" y1="52" x2="780" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe4af" />
      <stop offset="1" stop-color="#f6a749" />
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="920" height="600" rx="42" fill="url(#scene)"/>
  <rect x="84" y="110" width="792" height="368" rx="28" fill="rgba(255,255,255,0.14)"/>
  <rect x="120" y="420" width="720" height="30" rx="15" fill="rgba(34,24,18,0.18)"/>
  <circle cx="224" cy="268" r="88" fill="rgba(255,255,255,0.18)"/>
  <circle cx="736" cy="220" r="58" fill="rgba(255,255,255,0.15)"/>
  <text x="120" y="170" font-size="44" fill="#fff" font-family="Arial, sans-serif" font-weight="700">柏龙 小麦白啤</text>
  <text x="120" y="224" font-size="22" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif">柏龙白啤的酒体圆润，泡沫厚，入口是很典型的德式小麦路线。它既有麦香支撑，又不会像高苦度酒那样挑人，是聚餐里很好用的升级选项。</text>
  <text x="120" y="528" font-size="22" fill="#fff" font-family="Arial, sans-serif">适饮温度 5-7°C · 推荐搭配 沙拉 · 海鲜 · 德式香肠</text>
  <text x="120" y="566" font-size="18" fill="rgba(255,255,255,0.86)" font-family="Arial, sans-serif">小麦啤往往拥有更蓬松的泡沫和更柔和的酒体，常见果香、香料感和顺滑口感。</text>
</svg>